name: Publish package to PyPI
run-name: Publish to PyPI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry==1.3.2
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Configure poetry
        run: |
          python -m poetry config virtualenvs.in-project true
          python -m poetry config pypi-token.pypi ${{secrets.PYPI}}

      - name: Cache the virtualenv
        uses: actions/cache@v4
        with:
          path: ./.venv
          key: ${{ runner.os }}-venv-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: |
          python -m poetry install

      - name: Build and publish with Poetry
        run: |
          VERSION=$(python -m poetry version -s)
          if curl -sf "https://pypi.org/pypi/cenfind/${VERSION}/json" > /dev/null; then
            echo "cenfind ${VERSION} is already published on PyPI - nothing to do."
            echo "To publish a new release, bump the version in pyproject.toml before merging to main."
            exit 0
          fi
          python -m poetry --build publish
